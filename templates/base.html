<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}elf — Santa sync{% endblock %}</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #222; }
  header { background: #1f2937; color: #fff; padding: 12px 20px; display: flex; gap: 18px; align-items: center; }
  header a { color: #fff; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  header .brand { font-weight: 700; }
  main { padding: 20px; max-width: 1280px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
  th { background: #f3f4f6; }
  tr:hover td { background: #fafafa; }
  .filters { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
  .filters form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
  .filters label { display: block; font-size: 12px; color: #555; }
  .filters input, .filters select { padding: 4px 6px; font: inherit; }
  .filters button { padding: 4px 12px; }
  .btn { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; text-decoration: none; cursor: pointer; }
  .btn.danger { background: #dc2626; }
  .btn.secondary { background: #6b7280; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: #e5e7eb; }
  .pill.teacher { background: #dcfce7; color: #166534; }
  .pill.student { background: #dbeafe; color: #1e3a8a; }
  .pill.unknown { background: #fef3c7; color: #92400e; }
  .pill.block { background: #fee2e2; color: #991b1b; }
  .pill.allow { background: #dcfce7; color: #166534; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
  .stat { background: #f3f4f6; padding: 14px 16px; border-radius: 6px; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .l { font-size: 12px; color: #555; }
  .pagination { margin: 16px 0; }
  .pagination a, .pagination span { padding: 4px 8px; }
  pre { background: #0f172a; color: #f1f5f9; padding: 12px; border-radius: 6px; overflow: auto; }
  .dl { display: grid; grid-template-columns: 220px 1fr; gap: 4px 16px; }
  .dl dt { color: #555; }
  .errorlist { color: #b91c1c; margin: 4px 0; padding-left: 18px; }
  .banner { padding: 10px 16px; border-radius: 6px; margin-bottom: 16px; }
  .banner.warn { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .banner.info { background: #dbeafe; color: #1e3a8a; border: 1px solid #bfdbfe; }
  .messages li { list-style: none; }
</style>
</head>
<body>
<header>
  <span class="brand">elf · santa sync</span>
  <a href="{% url 'dashboard' %}">Dashboard</a>
  <a href="{% url 'rule-list' %}">Rules</a>
  <a href="{% url 'event-list' %}">Events</a>
  <a href="{% url 'unknown-list' %}">Unknown</a>
  <a href="{% url 'server-settings' %}">Settings</a>
  <a href="/admin/">Admin</a>
  <span style="margin-left:auto; font-size:12px;">{{ request.user }} · <a href="/admin/logout/">Log out</a></span>
</header>
<main>
{% if messages %}
  <ul class="messages" style="padding:0;">
    {% for m in messages %}<li class="banner info">{{ m }}</li>{% endfor %}
  </ul>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
